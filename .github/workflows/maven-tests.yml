name: Automation Tests Pipeline

on:
  push:

    branches: [ "main", "dev", "rama_integracion", "feature/**" ]
  pull_request:
    branches: [ "main", "dev", "rama_integracion" ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar pruebas automatizadas
        run: mvn clean test -DcontinueOnFailure=true

      - name: Publicar reporte de tests en la interfaz de GitHub
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          annotate_only: false
          detailed_summary: true

      - name: Subir resultados de Allure como Artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/
          retention-days: 7